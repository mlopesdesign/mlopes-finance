<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MLopes Finance</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="icons/appIcon.png" type="image/png">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">
      <img src="images/logo-horizontall-transparente.png" alt="ML Lopes Design" onerror="this.style.display='none'">
      <div>
        <strong>MLopes Finance</strong>
        <span class="muted">Finanças locais e auditáveis</span>
      </div>
    </div>
    <div class="topbar-actions" id="topbar-actions"></div>
    <div id="status" class="status">Inicializando banco local...</div>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Menu principal">
      <div class="nav">
        <button class="nav-button active" data-view="dashboard"><span>Visão geral</span></button>
        <button class="nav-button" data-view="lancamentos"><span>Lançamentos</span></button>
        <button class="nav-button" data-view="importacao"><span>Importar extrato</span></button>
        <button class="nav-button" data-view="transferencias"><span>Transferências</span></button>
        <button class="nav-button" data-view="baixas"><span>Baixas e saldos</span></button>
        <button class="nav-button" data-view="relatorios"><span>Relatórios</span></button>
        <button class="nav-button" data-view="contas"><span>Contas</span></button>
        <button class="nav-button" data-view="clientes"><span>Clientes</span></button>
        <button class="nav-button" data-view="fornecedores"><span>Fornecedores</span></button>
        <button class="nav-button" data-view="projetos"><span>Projetos</span></button>
        <button class="nav-button" data-view="centros_custo"><span>Centros de custo</span></button>
        <button class="nav-button" data-view="tags"><span>Tags</span></button>
        <button class="nav-button" data-view="categorias"><span>Categorias</span></button>
        <button class="nav-button" data-view="contextos"><span>Contextos</span></button>
      </div>
      <div class="sidebar-footer">
        <button class="nav-button" data-view="configuracoes"><span>Configurações</span></button>
      </div>
    </nav>
  <main id="app" class="content"></main>
  </div>
  <script src="js/vendor/neutralino.js"></script>
  <script src="js/vendor/sql-wasm.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
